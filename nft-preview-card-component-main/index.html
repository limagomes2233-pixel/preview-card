<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <!-- Google Fonts (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>

  <main class="card">
    <!-- Container da imagem (facilita o efeito de hover mais tarde) -->
    <div class="card__image-container">
      <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT" class="card__image">
    </div>

    <h1 class="card__title">Equilibrium #3429</h1>
    <p class="card__description">Our Equilibrium collection promotes balance and calm.</p>

    <!-- Dados do NFT (Preço e Tempo) -->
    <div class="card__details">
      <div class="card__price">
        <img src="images/icon-ethereum.svg" alt="" aria-hidden="true" class="icone">
        <span class="eth">0.041 ETH</span>
      </div>
      <div class="card__time">
        <img src="images/icon-clock.svg" alt="Icone do relógio" aria-hidden="true">
        <span>3 days left</span>
      </div>
    </div>

    <!-- Autor do NFT -->
    <div class="card__footer">
      <img src="images/image-avatar.png" alt="Avatar de Jules Wyvern" class="card__avatar">
      <p class="paragrafo">Creation of <a href="#" class="card__author">Jules Wyvern</a></p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Gabriel</a>.
  </footer>

</body>
</html>
